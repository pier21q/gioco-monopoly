# Pubblicazione su Render (https://render.com): un servizio web Node gratuito
# che tiene il gioco raggiungibile da un link pubblico, senza il tuo computer.
# Vedi "Metterlo online" nel README.
services:
  - type: web
    name: gioco-monopoly
    runtime: node
    plan: free
    # Si pubblica solo questo ramo (git push origin HEAD:pubblicazione): i push
    # sul ramo di lavoro non ripubblicano e non interrompono le partite.
    branch: pubblicazione
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /salute
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Chiave del tuo link da admin: la genera Render e la trovi in
      # Environment. Il link è https://gioco-monopoly.onrender.com/#admin=CHIAVE
      - key: ADMIN_CHIAVE
        generateValue: true
