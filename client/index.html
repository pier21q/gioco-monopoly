<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Monopoly multigiocatore online: crea una partita, condividi il link con gli amici e giocate dal browser, fino a 6 giocatori.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1E8E3E">
  <title>Monopoly online · gioca con gli amici</title>

  <!-- Favicon inline: una casetta verde su sfondo chiaro, niente file esterni da servire. -->
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23F3F1E7'/%3E%3Cpath d='M32 12 10 32h6v18h32V32h6z' fill='%231E8E3E'/%3E%3Crect x='27' y='36' width='10' height='14' fill='%23F3F1E7'/%3E%3C/svg%3E">

  <!-- Percorsi assoluti: il server serve la cartella client/ come radice web. -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/tabellone.css">
  <link rel="stylesheet" href="/css/pannelli.css">
</head>
<body>
  <a class="salta-contenuto" href="#tabellone">Vai al tabellone</a>

  <noscript>
    <p class="avviso-noscript">Per giocare serve JavaScript attivo nel browser.</p>
  </noscript>

  <!-- Schermata iniziale: crea/entra in una stanza, scegli nome e pedina, vedi chi c'è. -->
  <main id="lobby" aria-labelledby="lobby-titolo">
    <h1 id="lobby-titolo" class="visivamente-nascosto">Monopoly online</h1>
  </main>

  <!-- Tabellone con le 40 caselle e le pedine dei giocatori. -->
  <section id="tabellone" aria-label="Tabellone di gioco" hidden></section>

  <!-- Pannelli laterali: giocatori, proprietà, azioni del turno, registro eventi. -->
  <aside id="pannelli" aria-label="Pannelli di gioco" hidden></aside>

  <!-- Punto di montaggio delle finestre di dialogo (acquisti, aste, scambi, carte). -->
  <div id="dialoghi"></div>

  <!-- Notifiche brevi non bloccanti, lette dagli screen reader man mano che arrivano. -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
